<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>GLcn Hallo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6d7aea;
            --primary-dark: #5a67d8;
            --secondary: #7c5aa0;
            --accent: #ec8bf7;
            --accent-secondary: #f5576c;
            --dark: #1a1a2e;
            --darker: #16213e;
            --darkest: #0f172a;
            --text: #e2e8f0;
            --text-light: #a0aec0;
            --text-muted: #718096;
            --white: #ffffff;
            --success: #4ade80;
            --warning: #f59e0b;
            --danger: #f87171;
            
            --transition-smooth: cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --transition-spring: cubic-bezier(0.68, -0.55, 0.265, 1.55);
            --transition-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
            
            --duration-fast: 0.25s;
            --duration-normal: 0.4s;
            --duration-slow: 0.6s;
            
            --border-radius: 16px;
            --border-radius-lg: 24px;
            
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 6px 16px rgba(0, 0, 0, 0.15);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.2);
            --shadow-xl: 0 24px 48px rgba(0, 0, 0, 0.3);
            --shadow-glow: 0 0 30px rgba(102, 126, 234, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 50%, var(--secondary) 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(102, 126, 234, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(118, 75, 162, 0.08) 0%, transparent 50%);
            z-index: -1;
        }

        .container {
            width: 90%;
            max-width: 480px;
            text-align: center;
            padding: 2rem;
            animation: fadeInUp 1s ease-out forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .title {
            font-size: clamp(2.5rem, 8vw, 3.5rem);
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 3rem;
            letter-spacing: 0.05em;
            filter: drop-shadow(0 4px 20px rgba(102, 126, 234, 0.3));
            animation: titleGlow 3s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            from { filter: drop-shadow(0 0 5px rgba(102, 126, 234, 0.3)); }
            to { filter: drop-shadow(0 0 25px rgba(102, 126, 234, 0.6)); }
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            align-items: center;
        }

        .main-btn {
            width: 100%;
            max-width: 320px;
            padding: 1.2rem 2rem;
            border: none;
            border-radius: var(--border-radius-lg);
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--white);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all var(--duration-normal) var(--transition-bounce);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            text-decoration: none;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .main-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            z-index: -1;
            transition: all var(--duration-normal) var(--transition-smooth);
        }

        .main-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left var(--duration-slow) var(--transition-smooth);
        }

        .main-btn:hover::after {
            left: 100%;
        }

        .main-btn:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: var(--shadow-xl), var(--shadow-glow);
        }

        .main-btn:active {
            transform: translateY(-2px) scale(0.98);
        }

        .main-btn.secondary::before {
            background: linear-gradient(135deg, var(--secondary), var(--accent-secondary));
        }

        .main-btn.secondary:hover {
            box-shadow: var(--shadow-xl), 0 0 30px rgba(240, 147, 251, 0.4);
        }

        .main-btn i {
            font-size: 1.3rem;
        }

        /* 返回按钮 - outline 风格 */
        .back-btn {
            width: 100%;
            max-width: 320px;
            padding: 1rem 2rem;
            border-radius: var(--border-radius-lg);
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-light);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all var(--duration-normal) var(--transition-bounce);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .back-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left var(--duration-slow) var(--transition-smooth);
        }

        .back-btn:hover::after {
            left: 100%;
        }

        .back-btn:hover {
            transform: translateY(-3px) scale(1.02);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.25);
            color: var(--white);
            box-shadow: var(--shadow-lg);
        }

        .back-btn:active {
            transform: translateY(-1px) scale(0.98);
        }

        .back-btn i {
            font-size: 1.2rem;
        }

        /* 弹窗通用 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            opacity: 0;
            visibility: hidden;
            transition: all var(--duration-normal) var(--transition-smooth);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--border-radius-lg);
            padding: 2.5rem;
            max-width: 420px;
            width: 90%;
            transform: scale(0.9) translateY(30px);
            transition: all var(--duration-slow) var(--transition-bounce);
            position: relative;
            box-shadow: var(--shadow-xl);
            text-align: center;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
        }

        .modal-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 2rem;
            color: var(--white);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.4);
            animation: iconPulse 2s ease-in-out infinite;
        }

        .modal-icon.blue {
            background: linear-gradient(135deg, var(--primary), var(--accent));
        }

        .modal-icon.purple {
            background: linear-gradient(135deg, var(--secondary), var(--accent-secondary));
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(102, 126, 234, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(102, 126, 234, 0.6); }
        }

        .modal-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--white);
            margin-bottom: 0.5rem;
        }

        .modal-subtitle {
            color: var(--text-light);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .modal-info-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius);
            padding: 1rem 1.5rem;
            margin-bottom: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--warning);
            transition: all var(--duration-normal) var(--transition-smooth);
            word-break: break-all;
            text-align: left;
            width: 100%;
            justify-content: center;
        }

        .modal-info-box:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.02);
            box-shadow: var(--shadow-md);
        }

        .modal-info-box i {
            color: var(--accent);
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .modal-info-box .url-text {
            color: var(--text-light);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .modal-hint {
            color: var(--danger);
            font-size: 0.9rem;
            margin: 1rem 0 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-weight: 600;
        }

        .modal-hint i {
            font-size: 1.1rem;
        }

        .modal-footer {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .modal-btn {
            flex: 1;
            padding: 0.9rem 1.5rem;
            border: none;
            border-radius: var(--border-radius);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all var(--duration-fast) var(--transition-bounce);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .modal-btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
        }

        .modal-btn-primary:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: var(--shadow-glow), 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .modal-btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .modal-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            color: var(--white);
            transform: translateY(-3px) scale(1.02);
            box-shadow: var(--shadow-md);
        }

        body.modal-open {
            overflow: hidden;
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }
            
            .title {
                margin-bottom: 2.5rem;
            }
            
            .main-btn {
                padding: 1.1rem 1.5rem;
                font-size: 1.1rem;
            }
            
            .back-btn {
                padding: 0.9rem 1.5rem;
                font-size: 1rem;
            }
            
            .modal-content {
                padding: 2rem 1.2rem;
            }
            
            .modal-footer {
                gap: 0.75rem;
            }
            
            .modal-info-box {
                font-size: 1rem;
                padding: 0.8rem 1rem;
            }
        }

        ::selection {
            background: rgba(102, 126, 234, 0.3);
            color: var(--white);
        }

        *:focus {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">GLcn Hallo</h1>
        
        <div class="btn-group">
            <button class="main-btn" id="officialBtn" aria-label="访问官网">
                <i class="fas fa-globe"></i>
                官网
            </button>
            
            <button class="main-btn secondary" id="downloadBtn" aria-label="下载客户端">
                <i class="fas fa-download"></i>
                下载客户端
            </button>

            <button class="back-btn" id="backBtn" aria-label="关闭页面">
                <i class="fas fa-arrow-left"></i>
                返回
            </button>
        </div>
    </div>

    <!-- 官网访问弹窗 -->
    <div class="modal-overlay" id="officialModal" aria-hidden="true">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="officialModalTitle">
            <div class="modal-icon blue">
                <i class="fas fa-globe"></i>
            </div>
            <h2 class="modal-title" id="officialModalTitle">官网访问</h2>
            <p class="modal-subtitle">请用浏览器打开</p>
            
            <div class="modal-info-box">
                <i class="fas fa-link"></i>
                <span class="url-text">https://glcn26.github.io/</span>
            </div>
            
            <div class="modal-hint">
                <i class="fas fa-exclamation-triangle"></i>
                <span>提示：不要客户端内打开</span>
            </div>
            
            <div class="modal-footer">
                <button class="modal-btn modal-btn-secondary" id="officialCancel">
                    <i class="fas fa-times"></i>
                    取消
                </button>
                <button class="modal-btn modal-btn-primary" id="officialConfirm">
                    <i class="fas fa-external-link-alt"></i>
                    直接访问
                </button>
            </div>
        </div>
    </div>

    <!-- 下载提示弹窗 -->
    <div class="modal-overlay" id="downloadModal" aria-hidden="true">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="downloadModalTitle">
            <div class="modal-icon purple">
                <i class="fas fa-lock"></i>
            </div>
            <h2 class="modal-title" id="downloadModalTitle">下载客户端</h2>
            <p class="modal-subtitle">请使用以下密码访问下载页面</p>
            
            <div class="modal-info-box">
                <i class="fas fa-key"></i>
                <span>密码 6666</span>
            </div>
            
            <div class="modal-footer">
                <button class="modal-btn modal-btn-secondary" id="downloadCancel">
                    <i class="fas fa-times"></i>
                    取消
                </button>
                <button class="modal-btn modal-btn-primary" id="downloadConfirm">
                    <i class="fas fa-external-link-alt"></i>
                    确认跳转
                </button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const officialModal = document.getElementById('officialModal');
            const downloadModal = document.getElementById('downloadModal');
            const officialBtn = document.getElementById('officialBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const backBtn = document.getElementById('backBtn');
            const officialCancel = document.getElementById('officialCancel');
            const officialConfirm = document.getElementById('officialConfirm');
            const downloadCancel = document.getElementById('downloadCancel');
            const downloadConfirm = document.getElementById('downloadConfirm');
            const OFFICIAL_URL = 'https://glcn26.github.io/';
            const DOWNLOAD_URL = 'https://wwr.lanzoui.com/b018813w5a';

            function showModal(modal) {
                modal.classList.add('active');
                modal.setAttribute('aria-hidden', 'false');
                document.body.classList.add('modal-open');
            }

            function hideModal(modal) {
                modal.classList.remove('active');
                modal.setAttribute('aria-hidden', 'true');
                document.body.classList.remove('modal-open');
            }

            officialBtn.addEventListener('click', function() {
                showModal(officialModal);
            });

            officialCancel.addEventListener('click', function() {
                hideModal(officialModal);
            });

            officialConfirm.addEventListener('click', function() {
                hideModal(officialModal);
                window.open(OFFICIAL_URL, '_blank');
            });

            downloadBtn.addEventListener('click', function() {
                showModal(downloadModal);
            });

            downloadCancel.addEventListener('click', function() {
                hideModal(downloadModal);
            });

            downloadConfirm.addEventListener('click', function() {
                hideModal(downloadModal);
                window.open(DOWNLOAD_URL, '_blank');
            });

            backBtn.addEventListener('click', function() {
                window.close();
                // 如果浏览器阻止关闭，则尝试返回上一页
                if (window.history.length > 1) {
                    window.history.back();
                }
            });

            [officialModal, downloadModal].forEach(function(modal) {
                modal.addEventListener('click', function(e) {
                    if (e.target === modal) hideModal(modal);
                });
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    if (officialModal.classList.contains('active')) hideModal(officialModal);
                    if (downloadModal.classList.contains('active')) hideModal(downloadModal);
                }
            });
        })();
    </script>
</body>
</html>
