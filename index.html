<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>GLcn - Hello</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6d7aea;
            --primary-dark: #5a67d8;
            --secondary: #7c5aa0;
            --accent: #ec8bf7;
            --accent-secondary: #f5576c;
            --dark: #1a1a2e;
            --darker: #16213e;
            --darkest: #0f172a;
            --light: #f8fafc;
            --lighter: #e2e8f0;
            --text: #e2e8f0;
            --text-light: #a0aec0;
            --text-muted: #718096;
            --white: #ffffff;
            --success: #4ade80;
            --warning: #f59e0b;
            --danger: #f87171;
            --info: #60a5fa;
            --subject-chinese: #e53e3e;
            --subject-math: #3182ce;
            --subject-english: #38a169;
            --subject-physics: #d69e2e;
            --subject-chemistry: #805ad5;
            --subject-politics: #dd6b20;
            --subject-other: #718096;
            
            --transition-smooth: cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --transition-spring: cubic-bezier(0.68, -0.55, 0.265, 1.55);
            --transition-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
            --transition-ease-out: cubic-bezier(0.25, 0.46, 0.45, 0.94);
            
            --duration-fast: 0.25s;
            --duration-normal: 0.4s;
            --duration-slow: 0.6s;
            --duration-mega-slow: 0.8s;
            
            --border-radius: 16px;
            --border-radius-sm: 8px;
            --border-radius-lg: 24px;
            --border-radius-xl: 32px;
            
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 6px 16px rgba(0, 0, 0, 0.15);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.2);
            --shadow-xl: 0 24px 48px rgba(0, 0, 0, 0.3);
            --shadow-glow: 0 0 30px rgba(102, 126, 234, 0.4);
            
            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2rem;
            --spacing-xl: 3rem;
            --spacing-xxl: 4rem;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html { 
            scroll-behavior: smooth; 
            scroll-padding-top: 70px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: var(--dark);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
            font-size: clamp(0.95rem, 4vw, 1.05rem);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: all var(--duration-normal) var(--transition-smooth);
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(102, 126, 234, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(118, 75, 162, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(240, 147, 251, 0.04) 0%, transparent 50%);
            animation: backgroundShift 25s ease-in-out infinite;
            z-index: -1;
            will-change: transform;
        }

        @keyframes backgroundShift {
            0%, 100% { opacity: 0.3; transform: rotate(0deg) scale(1); }
            50% { opacity: 0.6; transform: rotate(3deg) scale(1.05); }
        }

        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            pointer-events: none;
            will-change: transform;
        }

        body.performance-mode .particle-glow {
            filter: blur(0.5px) drop-shadow(0 0 8px currentColor);
        }

        .navbar {
            position: fixed; top: 0; width: 100%;
            background: rgba(26, 26, 46, 0.8);
            backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 1000; 
            transition: all var(--duration-normal) var(--transition-smooth);
            transform: translateY(0);
            will-change: transform;
        }
        
        .navbar-container {
            max-width: 1200px; margin: 0 auto;
            display: flex; justify-content: space-between; align-items: center;
            padding: var(--spacing-sm) clamp(1rem, 5vw, 2rem);
            min-height: 70px;
        }
        
        .logo {
            font-size: clamp(1.6rem, 5vw, 1.8rem); font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            display: flex; align-items: center; gap: 0.5rem;
            transition: all var(--duration-slow) var(--transition-spring);
            cursor: pointer;
        }
        
        .logo:hover {
            transform: scale(1.05) translateY(-2px);
            filter: drop-shadow(0 0 15px rgba(102, 126, 234, 0.4));
        }
        
        .nav-menu {
            display: flex; gap: clamp(1rem, 3vw, 2.5rem); 
            list-style: none;
        }
        
        .nav-menu li {
            cursor: pointer; color: rgba(255, 255, 255, 0.8); 
            font-weight: 500; padding: var(--spacing-xs) 0; 
            position: relative; transition: all var(--duration-normal) var(--transition-spring);
            user-select: none;
        }
        
        .nav-menu li::after {
            content: ''; position: absolute; bottom: 0; left: 0;
            width: 0; height: 2px; border-radius: 1px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            transition: all var(--duration-normal) var(--transition-bounce);
        }
        
        .nav-menu li:hover::after, 
        .nav-menu li.active::after { width: 100%; }
        
        .nav-menu li:hover {
            color: var(--white);
            transform: translateY(-2px) scale(1.02);
        }

        .nav-menu li.active {
            color: var(--primary);
            transform: translateY(-1px);
        }
        
        .mobile-toggle {
            display: none; 
            background: rgba(255, 255, 255, 0.2); 
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white; font-size: 1.5rem; cursor: pointer;
            padding: 0.5rem 1rem; min-width: 88px; min-height: 44px;
            border-radius: var(--border-radius-lg); transition: all var(--duration-fast) var(--transition-bounce);
            display: flex; align-items: center; gap: 0.5rem; justify-content: center;
        }
        
        .mobile-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.4);
        }

        .mobile-toggle:active { transform: scale(0.95); }

        .mobile-toggle span {
            font-size: 0.9rem; font-weight: 500;
            white-space: nowrap;
        }

        .page {
            display: none; flex: 1;
            padding: var(--spacing-md);
            opacity: 0; transform: translateY(20px);
            transition: all var(--duration-mega-slow) var(--transition-smooth);
            height: auto; min-height: calc(100vh - 70px);
        }
        
        .page.active { 
            display: block; 
            opacity: 1; 
            transform: translateY(0);
        }
        
        .page.fade-out {
            opacity: 0;
            transform: translateY(-20px);
        }

        .hero {
            background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 50%, var(--secondary) 100%);
            color: white; text-align: center; 
            padding: clamp(2rem, 6vw, 4rem) clamp(1rem, 5vw, 2rem);
            position: relative; overflow: hidden;
            border-radius: var(--border-radius-lg);
            margin: var(--spacing-sm) auto;
            box-shadow: var(--shadow-xl);
            max-width: 1200px;
        }
        
        .hero::before {
            content: '';
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(102, 126, 234, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(240, 147, 251, 0.15) 0%, transparent 50%);
            animation: heroPulse 8s var(--transition-smooth) infinite;
            z-index: 1;
        }
        
        @keyframes heroPulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.02); }
        }

        .hero-content {
            position: relative; z-index: 1;
            width: 100%; display: flex;
            flex-direction: column; align-items: center;
        }

        .hero h1 {
            font-size: clamp(1.8rem, 6vw, 2.8rem); font-weight: 800; 
            margin-bottom: 1rem; line-height: 1.2;
            position: relative; z-index: 1;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 1s var(--transition-ease-out) forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #beijingTime {
            font-size: clamp(2rem, 8vw, 3.2rem); font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-align: center; letter-spacing: 0.05em;
            animation: timeGlow 2s var(--transition-smooth) infinite alternate;
        }

        @keyframes timeGlow {
            from { filter: drop-shadow(0 0 5px rgba(102, 126, 234, 0.3)); }
            to { filter: drop-shadow(0 0 20px rgba(102, 126, 234, 0.6)); }
        }

        .time-date {
            font-size: clamp(1rem, 3vw, 1.4rem); color: rgba(255, 255, 255, 0.85);
            margin-bottom: 1.5rem;
            animation: fadeInUp 1s var(--transition-ease-out) forwards 0.3s;
        }

        .uptime-display {
            font-size: clamp(0.9rem, 2.5vw, 1.1rem); color: rgba(255, 255, 255, 0.8);
            margin-bottom: 1.5rem; background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--border-radius);
            padding: var(--spacing-sm) var(--spacing-md); display: flex;
            align-items: center; gap: var(--spacing-sm); justify-content: center;
            width: fit-content; margin-left: auto; margin-right: auto; text-align: center;
            transition: all var(--duration-normal) var(--transition-smooth);
            animation: fadeInUp 1s var(--transition-ease-out) forwards 0.6s;
        }

        .uptime-display:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px) scale(1.02);
            box-shadow: var(--shadow-glow);
        }

        .uptime-icon {
            font-size: 1.2rem; color: var(--success);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        .ua-display {
            background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: var(--border-radius);
            padding: var(--spacing-sm) var(--spacing-md); margin-top: 1rem;
            display: flex; align-items: center; gap: var(--spacing-sm);
            font-size: clamp(0.9rem, 2.5vw, 1.1rem); color: rgba(255, 255, 255, 0.9);
            transition: all var(--duration-normal) var(--transition-smooth); justify-content: center;
            width: fit-content; margin-left: auto; margin-right: auto; text-align: center;
            animation: fadeInUp 1s var(--transition-ease-out) forwards 1s;
        }

        .ua-display:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px) scale(1.02);
            box-shadow: var(--shadow-glow);
        }

        .ua-icon {
            font-size: 1.2rem; color: var(--accent);
        }

        .stn-studio-display {
            position: relative; margin-top: 1.5rem; padding: 1rem 2rem;
            background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 50px;
            font-size: clamp(1.1rem, 3vw, 1.5rem); font-weight: 700; color: var(--white);
            text-align: center; animation: fadeInUp 1s var(--transition-ease-out) forwards 0.9s, stnGlow 3s ease-in-out infinite;
            transition: all var(--duration-normal) var(--transition-smooth); overflow: hidden;
        }

        .stn-studio-display::before {
            content: '';
            position: absolute; top: 50%; left: 50%;
            width: 120%; height: 120%;
            transform: translate(-50%, -50%);
            background: conic-gradient(from 0deg, transparent, rgba(102, 126, 234, 0.3), rgba(240, 147, 251, 0.3), transparent);
            animation: stnRotate 4s linear infinite; z-index: -1; border-radius: 50px;
        }

        .stn-studio-display::after {
            content: ''; position: absolute; top: 2px; left: 2px; right: 2px; bottom: 2px;
            background: var(--dark); border-radius: 48px; z-index: -1;
        }

        @keyframes stnRotate {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes stnGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(102, 126, 234, 0.3); }
            50% { box-shadow: 0 0 30px rgba(72, 187, 120, 0.6), 0 0 40px rgba(240, 147, 251, 0.3); }
        }

        .stn-studio-display:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .content-section {
            padding-top: 70px; min-height: 100vh;
            display: flex; flex-direction: column;
        }

        .feature-card {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: var(--border-radius-lg);
            padding: var(--spacing-xl); text-align: center;
            transition: all var(--duration-normal) var(--transition-bounce);
            position: relative; overflow: hidden;
            margin: var(--spacing-md) auto; max-width: 800px;
        }

        .feature-card::before {
            content: '';
            position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
            transition: left var(--duration-mega-slow) var(--transition-smooth);
        }

        .feature-card:hover::before { left: 100%; }

        .feature-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: var(--shadow-xl), var(--shadow-glow);
            border-color: rgba(102, 126, 234, 0.3);
        }

        .feature-icon {
            font-size: 4rem; color: var(--primary);
            margin-bottom: var(--spacing-md);
            transition: all var(--duration-normal) var(--transition-bounce);
            display: inline-block;
        }

        .feature-card:hover .feature-icon {
            transform: scale(1.1) rotate(5deg);
            color: var(--accent);
        }

        .feature-title {
            font-size: 1.5rem; font-weight: 700;
            margin-bottom: var(--spacing-sm); color: var(--white);
        }

        .feature-description {
            color: var(--text-light); line-height: 1.6;
        }

        .announcement-content {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: calc(100vh - 300px); padding: var(--spacing-lg) 0;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            z-index: 2000; opacity: 0; visibility: hidden;
            transition: all var(--duration-normal) var(--transition-smooth);
        }

        .modal-overlay.active {
            opacity: 1; visibility: visible;
        }

        .modal-content {
            background: rgba(26, 26, 46, 0.95); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: var(--border-radius-lg);
            padding: var(--spacing-xl); max-width: 500px;
            width: 90%; max-height: 80vh; overflow-y: auto;
            transform: scale(0.8) translateY(50px);
            transition: all var(--duration-slow) var(--transition-bounce);
            position: relative;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: var(--spacing-lg); padding-bottom: var(--spacing-md);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-title {
            font-size: 1.5rem; font-weight: 700;
            color: var(--white); display: flex;
            align-items: center; gap: var(--spacing-sm);
        }

        .modal-close {
            background: none; border: none; color: var(--text-light);
            font-size: 1.5rem; cursor: pointer; padding: var(--spacing-xs);
            border-radius: var(--border-radius-sm); transition: all var(--duration-fast) var(--transition-smooth);
        }

        .modal-close:hover {
            color: var(--white); background: rgba(255, 255, 255, 0.1);
        }

        .modal-body {
            color: var(--text-light); line-height: 1.6;
        }

        .modal-body h4 {
            color: var(--white); margin-bottom: var(--spacing-sm);
            font-size: 1.1rem;
        }

        .modal-body p { margin-bottom: var(--spacing-md); }

        .modal-body .info-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md); margin: var(--spacing-md) 0;
        }

        .modal-body .info-item {
            background: rgba(255, 255, 255, 0.05); padding: var(--spacing-sm);
            border-radius: var(--border-radius-sm); border-left: 3px solid var(--primary);
        }

        .modal-body .info-label {
            font-size: 0.8rem; color: var(--text-muted);
            margin-bottom: 0.25rem;
        }

        .modal-body .info-value {
            color: var(--white); font-weight: 600;
        }

        .modal-footer {
            margin-top: var(--spacing-lg); padding-top: var(--spacing-md);
            border-top: 1px solid rgba(255, 255, 255, 0.1); text-align: center;
        }

        .modal-button {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none; color: white; padding: var(--spacing-sm) var(--spacing-lg);
            border-radius: var(--border-radius); font-weight: 600;
            cursor: pointer; transition: all var(--duration-fast) var(--transition-bounce);
        }

        .modal-button:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: var(--shadow-glow);
        }

        footer {
            background: var(--darkest); color: rgba(255, 255, 255, 0.8);
            padding: var(--spacing-lg) clamp(1rem, 5vw, 2rem); text-align: center;
            position: relative; overflow: hidden; margin-top: auto;
        }
        
        footer::before {
            content: ''; position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 0%, rgba(102, 126, 234, 0.1) 0%, transparent 70%);
        }
        
        .footer-content { 
            max-width: 1200px; margin: 0 auto; 
            position: relative; z-index: 1;
            transition: all var(--duration-normal) var(--transition-smooth);
        }
        
        .footer-content:hover {
            color: var(--white);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .nav-menu {
                position: fixed; top: 70px; left: -100%;
                width: 100%; height: calc(100vh - 70px); 
                background: rgba(26, 26, 46, 0.95);
                flex-direction: column; align-items: center; justify-content: flex-start;
                padding-top: var(--spacing-xl); transition: left 0.5s var(--transition-bounce);
                backdrop-filter: blur(20px); border-top: 1px solid rgba(255, 255, 255, 0.1);
            }
            
            .nav-menu li { 
                width: 80%; text-align: center; 
                padding: var(--spacing-md); margin: var(--spacing-xs) 0;
                border-radius: var(--border-radius);
                transition: all var(--duration-normal) var(--transition-smooth);
            }

            .nav-menu li:hover {
                background: rgba(102, 126, 234, 0.1);
                transform: translateX(5px);
            }
            
            .nav-menu li::after {
                left: 50%; transform: translateX(-50%);
            }
            
            .nav-menu.active { left: 0; }
            .mobile-toggle { display: flex; }

            .hero {
                margin: var(--spacing-xs) auto;
                padding: clamp(1.5rem, 5vw, 3rem) clamp(1rem, 4vw, 1.5rem);
            }

            #beijingTime { font-size: clamp(1.8rem, 6vw, 2.5rem); }
            .time-date { font-size: clamp(0.9rem, 2.5vw, 1.1rem); }
            .uptime-display { font-size: clamp(0.8rem, 2vw, 0.95rem); padding: var(--spacing-xs) var(--spacing-sm); }
            .ua-display { font-size: clamp(0.8rem, 2vw, 0.95rem); padding: var(--spacing-xs) var(--spacing-sm); }
            .stn-studio-display {
                padding: 0.8rem 1.5rem;
                font-size: clamp(0.95rem, 2.5vw, 1.2rem);
            }

            .modal-content {
                width: 95%;
                padding: var(--spacing-lg);
                margin: var(--spacing-md);
            }

            .modal-body .info-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 480px) {
            .page { padding: var(--spacing-sm); }
            .hero { padding: clamp(1.2rem, 4vw, 2.5rem) clamp(0.5rem, 3vw, 1rem); }
            #beijingTime { font-size: clamp(1.6rem, 5vw, 2.2rem); }
            .time-date { font-size: clamp(0.9rem, 2.5vw, 1.1rem); }
            .uptime-display { font-size: clamp(0.75rem, 2vw, 0.9rem); }
            .ua-display { font-size: clamp(0.8rem, 2vw, 0.95rem); }
            .stn-studio-display {
                padding: 0.6rem 1.2rem;
                font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            }
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--dark); }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--primary), var(--accent));
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(var(--primary-dark), var(--accent-secondary));
        }

        ::selection {
            background: rgba(102, 126, 234, 0.3);
            color: var(--white);
        }

        *:focus {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        .ua-pc { color: var(--primary); }
        .ua-ios { color: var(--success); }
        .ua-android { color: var(--warning); }
        .ua-mobile { color: var(--accent); }
        .ua-wechat { color: #07C160; }

    <script>
        class EnhancedParticleNetwork {
            constructor() {
                this.canvas = document.getElementById('particles-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.layers = { background: [], middle: [], foreground: [] };
                this.mouse = { x: -1000, y: -1000 };
                this.mouseTrail = [];
                this.lastMouseTime = 0;
                this.animationId = null;
                this.lastFrameTime = 0;
                this.frameCount = 0;
                this.fps = 0;
                this.targetFPS = 60;
                this.isReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                this.isPerformanceMode = document.body.classList.contains('performance-mode');
                this.particleConfig = this.isPerformanceMode ? {
                    background: { count: 40, speed: 0.3, size: [1.5, 2.5], opacity: [0.2, 0.4], color: '#7c5aa0' },
                    middle: { count: 50, speed: 0.8, size: [2, 3], opacity: [0.4, 0.6], color: '#6d7aea' },
                    foreground: { count: 30, speed: 1.5, size: [3, 4], opacity: [0.6, 0.8], color: '#ec8bf7' }
                } : {
                    background: { count: 20, speed: 0.2, size: [1, 2], opacity: [0.1, 0.3], color: '#7c5aa0' },
                    middle: { count: 30, speed: 0.5, size: [1.5, 2.5], opacity: [0.3, 0.5], color: '#6d7aea' },
                    foreground: { count: 15, speed: 1.0, size: [2, 3], opacity: [0.5, 0.7], color: '#ec8bf7' }
                };
                
                this.init();
                this.createParticles();
                this.animate();
                this.bindEvents();
            }
            
            init() {
                this.resizeCanvas();
                window.addEventListener('resize', () => {
                    this.resizeCanvas();
                    this.createParticles();
                });
                
                setInterval(() => {
                    this.fps = this.frameCount;
                    this.frameCount = 0;
                    this.adjustParticleCount();
                }, 1000);
            }
            
            resizeCanvas() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }
            
            createParticles() {
                this.layers = { background: [], middle: [], foreground: [] };
                
                Object.keys(this.layers).forEach(layerName => {
                    const config = this.particleConfig[layerName];
                    const count = Math.min(config.count, Math.floor((window.innerWidth * window.innerHeight) / 15000));
                    
                    for (let i = 0; i < count; i++) {
                        this.layers[layerName].push({
                            x: Math.random() * this.canvas.width,
                            y: Math.random() * this.canvas.height,
                            vx: (Math.random() - 0.5) * config.speed * 0.5,
                            vy: (Math.random() - 0.5) * config.speed * 0.5,
                            radius: config.size[0] + Math.random() * (config.size[1] - config.size[0]),
                            opacity: config.opacity[0] + Math.random() * (config.opacity[1] - config.opacity[0]),
                            color: config.color,
                            trail: [],
                            glowIntensity: 0,
                            breathOffset: Math.random() * Math.PI * 2
                        });
                    }
                });
            }
            
            adjustParticleCount() {
                if (!this.isPerformanceMode) return;
                if (this.fps < 45 && this.layers.foreground.length > 10) {
                    this.layers.foreground = this.layers.foreground.slice(0, -5);
                } else if (this.fps > 55 && this.layers.foreground.length < this.particleConfig.foreground.count) {
                    this.createParticles();
                }
            }
            
            bindEvents() {
                const updateMouse = (e) => {
                    this.mouse.x = e.clientX;
                    this.mouse.y = e.clientY;
                    const now = Date.now();
                    if (now - this.lastMouseTime > 30) {
                        this.mouseTrail.push({ x: e.clientX, y: e.clientY, time: now });
                        this.lastMouseTime = now;
                        if (this.mouseTrail.length > 8) this.mouseTrail.shift();
                    }
                };

                window.addEventListener('mousemove', updateMouse);
                window.addEventListener('touchmove', (e) => {
                    if (e.touches.length > 0) updateMouse(e.touches[0]);
                });
                
                window.addEventListener('click', (e) => {
                    if (this.isPerformanceMode) this.createClickEffect(e.clientX, e.clientY);
                });
                
                window.addEventListener('mouseleave', () => {
                    this.mouse.x = -1000;
                    this.mouse.y = -1000;
                    this.mouseTrail = [];
                });
                
                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) this.stop();
                    else this.start();
                });
            }
            
            createClickEffect(x, y) {
                for (let layer = 0; layer < 3; layer++) {
                    const particleCount = 6 + layer * 6;
                    const speed = 4 - layer * 1.2;
                    const color = layer === 0 ? '#ec8bf7' : layer === 1 ? '#6d7aea' : '#7c5aa0';
                    
                    for (let i = 0; i < particleCount; i++) {
                        const angle = (Math.PI * 2 / particleCount) * i + Math.random() * 0.3;
                        this.layers.foreground.push({
                            x: x + Math.random() * 20 - 10,
                            y: y + Math.random() * 20 - 10,
                            vx: Math.cos(angle) * speed,
                            vy: Math.sin(angle) * speed,
                            radius: 2 + Math.random() * 2,
                            opacity: 0.9,
                            color: color,
                            life: 40 + layer * 10,
                            isEffect: true
                        });
                    }
                }
            }
            
            animate() {
                if (this.isReducedMotion) {
                    this.animationId = setTimeout(() => this.animate(), 100);
                } else {
                    this.animationId = requestAnimationFrame(() => this.animate());
                }

                const now = Date.now();
                if (now - this.lastFrameTime < (1000 / this.targetFPS) && !this.isReducedMotion) return;
                this.lastFrameTime = now;
                this.frameCount++;

                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                if (this.mouseTrail.length > 1 && this.isPerformanceMode) {
                    this.ctx.strokeStyle = 'rgba(102, 126, 234, 0.3)';
                    this.ctx.lineWidth = 2;
                    this.ctx.beginPath();
                    this.mouseTrail.forEach((point, index) => {
                        if (index === 0) this.ctx.moveTo(point.x, point.y);
                        else this.ctx.lineTo(point.x, point.y);
                    });
                    this.ctx.stroke();
                }
                
                ['background', 'middle', 'foreground'].forEach((layerName, layerIndex) => {
                    const particles = this.layers[layerName];
                    const layerMultiplier = (layerIndex + 1) * 0.5;
                    
                    particles.forEach((particle, i) => {
                        if (particle.isEffect) {
                            particle.life--;
                            if (particle.life <= 0) {
                                particles.splice(i, 1);
                                return;
                            }
                            particle.vx *= 0.95;
                            particle.vy *= 0.95;
                            particle.opacity = particle.life / 60 * 0.8;
                        }
                        
                        const breathScale = 1 + Math.sin(Date.now() * 0.003 + particle.breathOffset) * 0.1;
                        const currentRadius = particle.radius * breathScale;
                        
                        const dx = this.mouse.x - particle.x;
                        const dy = this.mouse.y - particle.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        const influenceRange = 120 + layerIndex * 30;
                        
                        if (distance < influenceRange && distance > 0) {
                            const force = (1 - distance / influenceRange) * 0.02 * layerMultiplier;
                            const angle = Math.atan2(dy, dx);
                            
                            if (distance < 30) {
                                particle.vx -= Math.cos(angle) * force * 3;
                                particle.vy -= Math.sin(angle) * force * 3;
                                particle.glowIntensity = 1.0;
                            } else if (distance < 80) {
                                particle.vx += Math.cos(angle) * force;
                                particle.vy += Math.sin(angle) * force;
                                particle.glowIntensity = 0.6;
                            } else {
                                particle.vx += Math.cos(angle) * force * 0.3;
                                particle.vy += Math.sin(angle) * force * 0.3;
                                particle.glowIntensity = 0.3;
                            }
                        } else {
                            particle.glowIntensity *= 0.95;
                        }
                        
                        particle.x += particle.vx;
                        particle.y += particle.vy;
                        
                        if (particle.x < currentRadius || particle.x > this.canvas.width - currentRadius) {
                            particle.vx *= -0.8;
                            particle.x = Math.max(currentRadius, Math.min(this.canvas.width - currentRadius, particle.x));
                        }
                        if (particle.y < currentRadius || particle.y > this.canvas.height - currentRadius) {
                            particle.vy *= -0.8;
                            particle.y = Math.max(currentRadius, Math.min(this.canvas.height - currentRadius, particle.y));
                        }
                        
                        if (this.isPerformanceMode) {
                            particle.trail.push({ x: particle.x, y: particle.y });
                            if (particle.trail.length > 8) particle.trail.shift();
                        }
                        
                        this.ctx.save();
                        
                        if (particle.trail && particle.trail.length > 1) {
                            particle.trail.forEach((pos, j) => {
                                this.ctx.globalAlpha = (j / particle.trail.length) * particle.opacity * 0.3;
                                this.ctx.fillStyle = particle.color;
                                this.ctx.beginPath();
                                this.ctx.arc(pos.x, pos.y, currentRadius * (j / particle.trail.length), 0, Math.PI * 2);
                                this.ctx.fill();
                            });
                        }
                        
                        this.ctx.globalAlpha = particle.opacity;
                        this.ctx.fillStyle = particle.color;
                        
                        if (this.isPerformanceMode && particle.glowIntensity > 0.1) {
                            this.ctx.shadowBlur = 15 * particle.glowIntensity;
                            this.ctx.shadowColor = particle.color + Math.floor(particle.opacity * 255).toString(16).padStart(2, '0');
                        }
                        
                        this.ctx.beginPath();
                        this.ctx.arc(particle.x, particle.y, currentRadius, 0, Math.PI * 2);
                        this.ctx.fill();
                        
                        this.ctx.restore();
                    });
                    
                    if (this.isPerformanceMode && layerName === 'middle') {
                        this.drawConnections(particles, 80);
                    }
                });
            }
            
            drawConnections(particles, maxDistance) {
                this.ctx.strokeStyle = 'rgba(102, 126, 234, 0.4)';
                this.ctx.lineWidth = 1;
                
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[j].x - particles[i].x;
                        const dy = particles[j].y - particles[i].y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance < maxDistance) {
                            const opacity = (maxDistance - distance) / maxDistance * 0.4;
                            this.ctx.globalAlpha = opacity;
                            this.ctx.beginPath();
                            this.ctx.moveTo(particles[i].x, particles[i].y);
                            this.ctx.lineTo(particles[j].x, particles[j].y);
                            this.ctx.stroke();
                        }
                    }
                }
            }
            
            start() {
                if (!this.animationId) this.animate();
            }
            
            stop() {
                if (this.animationId) {
                    if (this.isReducedMotion) clearTimeout(this.animationId);
                    else cancelAnimationFrame(this.animationId);
                    this.animationId = null;
                }
            }
            
            destroy() { this.stop(); }
        }

        function detectUA() {
            const ua = navigator.userAgent.toLowerCase();
            const uaDisplay = document.getElementById('uaDisplay');
            const uaIcon = document.getElementById('uaIcon');
            const uaText = document.getElementById('uaText');
            
            let deviceType = '';
            let iconClass = '';
            let deviceClass = '';
            
            if (/iphone|ipad|ipod/.test(ua)) {
                deviceType = 'IOS';
                iconClass = 'fa-mobile-alt';
                deviceClass = 'ua-ios';
            }
            else if (/android/.test(ua)) {
                deviceType = '安卓手机端';
                iconClass = 'fa-android';
                deviceClass = 'ua-android';
            }
            else if (/micromessenger/.test(ua)) {
                deviceType = '微信端';
                iconClass = 'fa-comment-dots';
                deviceClass = 'ua-wechat';
            }
            else if (/qq\//.test(ua) || /qqbrowser/.test(ua) || /qqapp/.test(ua)) {
                deviceType = 'QQ端';
                iconClass = 'fa-comment';
                deviceClass = 'ua-qq';
            }
            else if (/windows|macintosh|linux/.test(ua) && !/mobile/.test(ua)) {
                deviceType = 'PC';
                iconClass = 'fa-desktop';
                deviceClass = 'ua-pc';
            }
            else if (/mobile|tablet/.test(ua)) {
                deviceType = '手机端';
                iconClass = 'fa-mobile-alt';
                deviceClass = 'ua-mobile';
            }
            else {
                deviceType = 'PC';
                iconClass = 'fa-desktop';
                deviceClass = 'ua-pc';
            }
            
            uaText.textContent = `当前访问UA：${deviceType}`;
            uaIcon.className = `fas ${iconClass} ua-icon ${deviceClass}`;
            uaDisplay.style.animation = 'fadeInUp 0.8s ease-out 1s both';
        }

        class PerformanceModeManager {
            constructor() {
                this.mode = this.getStoredMode() || 'performance';
            }
            
            setMode(mode) {
                this.mode = mode;
                localStorage.setItem('performanceMode', mode);
                this.applyMode(mode);
            }
            
            applyMode(mode) {
                const body = document.body;
                if (mode === 'compatibility') {
                    body.classList.remove('performance-mode');
                    body.classList.add('compatibility-mode');
                    if (window.particleNetwork) window.particleNetwork.stop();
                } else {
                    body.classList.remove('compatibility-mode');
                    body.classList.add('performance-mode');
                    if (window.particleNetwork) window.particleNetwork.start();
                }
            }
            
            getStoredMode() {
                return localStorage.getItem('performanceMode');
            }
        }

        class MusicLoader {
            constructor() {
                this.supportedFormats = [
                    { ext: 'mp3', type: 'audio/mpeg' },
                    { ext: 'aac', type: 'audio/aac' },
                    { ext: 'm4a', type: 'audio/mp4' },
                    { ext: 'ogg', type: 'audio/ogg' },
                    { ext: 'wav', type: 'audio/wav' },
                    { ext: 'flac', type: 'audio/flac' }
                ];
                this.foundMusic = null;
            }
            
            async detectMusic() {
                const basePath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
                const namePatterns = ['music', 'bgm', 'background', 'audio'];
                
                for (const name of namePatterns) {
                    for (const format of this.supportedFormats) {
                        const url = `${basePath}${name}.${format.ext}`;
                        try {
                            const result = await this.checkFile(url, format);
                            if (result) {
                                this.foundMusic = result;
                                return result;
                            }
                        } catch (e) { continue; }
                    }
                }
                return null;
            }
            
            checkFile(url, format) {
                return new Promise((resolve, reject) => {
                    const audio = new Audio();
                    let resolved = false;
                    
                    const onCanPlay = () => {
                        if (!resolved) { resolved = true; resolve({ url, format }); }
                    };
                    const onError = () => {
                        if (!resolved) { resolved = true; reject(null); }
                    };
                    const timeout = setTimeout(() => {
                        if (!resolved) { resolved = true; reject(null); }
                    }, 3000);
                    
                    audio.addEventListener('canplaythrough', onCanPlay, { once: true });
                    audio.addEventListener('error', onError, { once: true });
                    audio.src = url;
                    audio.load();
                });
            }
            
            updateAudioElement(audio) {
                if (!this.foundMusic) return false;
                audio.innerHTML = '';
                const source = document.createElement('source');
                source.src = this.foundMusic.url;
                source.type = this.foundMusic.format.type;
                audio.appendChild(source);
                return true;
            }
        }

        function setupMusicPlayer() {
            const musicButton = document.getElementById('musicButton');
            const musicIcon = document.getElementById('musicIcon');
            const bgMusic = document.getElementById('bgMusic');
            const statusElement = document.getElementById('lyricsStatus');
            
            let isPlaying = false;
            let mediaSessionSupported = false;
            
            const updateButtonState = (state) => {
                switch(state) {
                    case 'loading':
                        musicIcon.className = 'fas fa-spinner fa-spin';
                        musicButton.disabled = true;
                        break;
                    case 'ready':
                        musicIcon.className = 'fas fa-play';
                        musicButton.disabled = false;
                        break;
                    case 'error':
                        musicIcon.className = 'fas fa-exclamation-triangle';
                        musicButton.disabled = true;
                        if(statusElement) {
                            statusElement.innerHTML = '<i class="fas fa-exclamation-circle"></i> <span>音乐文件加载失败</span>';
                            statusElement.className = 'lyrics-status error';
                        }
                        break;
                    case 'playing':
                        musicIcon.className = 'fas fa-pause';
                        musicButton.classList.add('playing');
                        break;
                    case 'paused':
                        musicIcon.className = 'fas fa-play';
                        musicButton.classList.remove('playing');
                        break;
                }
            };
            
            bgMusic.addEventListener('progress', () => {
                if (bgMusic.readyState >= 2 && !isPlaying) updateButtonState('ready');
            });
            
            musicButton.addEventListener('click', () => {
                if (!isPlaying) {
                    bgMusic.play().then(() => {
                        isPlaying = true;
                        updateButtonState('playing');
                    }).catch(e => {
                        updateButtonState('error');
                    });
                } else {
                    bgMusic.pause();
                    isPlaying = false;
                    updateButtonState('paused');
                }
                updateMediaSessionState();
            });
            
            bgMusic.addEventListener('ended', () => {
                isPlaying = false;
                updateButtonState('paused');
                updateMediaSessionState();
            });
            
            bgMusic.addEventListener('loadedmetadata', () => {
                if(statusElement) {
                    statusElement.innerHTML = `<i class="fas fa-check-circle"></i> <span>音乐已加载：${bgMusic.duration.toFixed(1)}秒</span>`;
                }
                setupMediaSession();
            });
            
            bgMusic.addEventListener('error', () => {
                statusElement?.classList.add('error');
            });
            
            bgMusic.loop = true;
            
            function setupMediaSession() {
                if ('mediaSession' in navigator) {
                    mediaSessionSupported = true;
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: 'STNStudio背景音乐',
                        artist: 'GLcn',
                        album: '网页播放器',
                        artwork: [
                            { src: 'https://raw.githubusercontent.com/glcn26/glcn26.github.io/main/musiclogo.jpg', sizes: '512x512', type: 'image/jpeg' }
                        ]
                    });
                    
                    navigator.mediaSession.setActionHandler('play', () => {
                        if (!isPlaying) musicButton.click();
                    });
                    
                    navigator.mediaSession.setActionHandler('pause', () => {
                        if (isPlaying) musicButton.click();
                    });
                }
            }
            
            function updateMediaSessionState() {
                if (!mediaSessionSupported || !navigator.mediaSession) return;
                navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused';
            }
        }

        class ServerTimeManager {
            constructor() {
                this.serverTimeOffset = 0;
                this.lastSyncTime = 0;
                this.isInitialized = false;
            }
            
            async fetchBeijingTime() {
                try {
                    const apis = [
                        'https://worldtimeapi.org/api/timezone/Asia/Shanghai',
                        'https://api.github.com'
                    ];
                    
                    for (let api of apis) {
                        try {
                            const response = await fetch(api, { 
                                method: 'GET',
                                cache: 'no-cache',
                                signal: AbortSignal.timeout(5000)
                            });
                            
                            if (api.includes('worldtimeapi')) {
                                const data = await response.json();
                                const serverTime = new Date(data.datetime).getTime();
                                return serverTime;
                            } else {
                                const dateString = response.headers.get('Date');
                                const serverTime = new Date(dateString).getTime();
                                return serverTime;
                            }
                        } catch (e) { continue; }
                    }
                    throw new Error('所有时间API均不可用');
                } catch (error) {
                    return null;
                }
            }
            
            async syncTime() {
                const startTime = Date.now();
                const serverTime = await this.fetchBeijingTime();
                const endTime = Date.now();
                
                if (serverTime) {
                    const networkDelay = (endTime - startTime) / 2;
                    this.serverTimeOffset = (serverTime + networkDelay) - Date.now();
                    this.lastSyncTime = Date.now();
                    this.isInitialized = true;
                    return true;
                }
                return false;
            }
            
            getBeijingTime() {
                return this.isInitialized ? new Date(Date.now() + this.serverTimeOffset) : new Date();
            }
            
            shouldResync() {
                return Date.now() - this.lastSyncTime > 5 * 60 * 1000;
            }
        }
        
        const serverTimeManager = new ServerTimeManager();

            const beijingTime = serverTimeManager.getBeijingTime();

        class LyricParser {
            constructor() {
                this.lyrics = [];
                this.title = '';
                this.artist = '';
                this.album = '';
            }
            
            parse(lrcContent) {
                this.lyrics = [];
                const lines = lrcContent.split('\n');
                
                lines.forEach(line => {
                    const metaMatch = line.match(/^\[(ti|ar|al):(.+)\]$/i);
                    if (metaMatch) {
                        const [, key, value] = metaMatch;
                        switch(key.toLowerCase()) {
                            case 'ti': this.title = value; break;
                            case 'ar': this.artist = value; break;
                            case 'al': this.album = value; break;
                        }
                    }
                });
                
                lines.forEach(line => {
                    const timeMatches = line.match(/\[(\d{2}):(\d{2})\.(\d{2,3})\]/g);
                    const textMatch = line.match(/\].*$/);
                    
                    if (timeMatches && textMatch) {
                        const text = textMatch[0].substring(1).trim();
                        timeMatches.forEach(timeMatch => {
                            const [, min, sec, ms] = timeMatch.match(/\[(\d{2}):(\d{2})\.(\d{2,3})\]/);
                            const time = parseInt(min) * 60 + parseInt(sec) + parseInt(ms) / (ms.length === 2 ? 100 : 1000);
                            this.lyrics.push({ time, text });
                        });
                    }
                });
                
                this.lyrics.sort((a, b) => a.time - b.time);
                return {
                    lyrics: this.lyrics,
                    title: this.title,
                    artist: this.artist,
                    album: this.album
                };
            }
        }

        class LyricDisplay {
            constructor() {
                this.lyrics = [];
                this.currentIndex = -1;
                this.container = document.getElementById('lyricsContainer');
                this.linesContainer = document.getElementById('lyricsLines');
                this.progressBar = document.getElementById('lyricsProgressBar');
                this.status = document.getElementById('lyricsStatus');
                this.toggle = document.getElementById('lyricsToggle');
                this.title = document.getElementById('lyricsTitle');
                this.isCollapsed = true;
                this.isReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                
                this.setupToggle();
                this.bindEvents();
            }
            
            setupToggle() {
                this.toggle.addEventListener('click', () => {
                    this.isCollapsed = !this.isCollapsed;
                    this.container.classList.toggle('collapsed');
                    
                    const icon = this.toggle.querySelector('i');
                    const text = this.toggle.querySelector('span');
                    
                    if (this.isCollapsed) {
                        icon.className = 'fas fa-chevron-up';
                        text.textContent = '展开';
                    } else {
                        icon.className = 'fas fa-chevron-down';
                        text.textContent = '收起';
                    }
                });
            }
            
            bindEvents() {
                this.linesContainer.addEventListener('click', (e) => {
                    if (e.target.classList.contains('lyrics-line')) {
                        const index = parseInt(e.target.dataset.index);
                        if (index >= 0 && this.lyrics[index]) {
                            this.seekToTime(this.lyrics[index].time);
                        }
                    }
                });
            }
            
            async loadLyrics(url) {
                this.showStatus('loading', '正在加载歌词...');
                
                try {
                    const controller = new AbortController();
                    const timeout = setTimeout(() => controller.abort(), 5000);
                    
                    const response = await fetch(url, { 
                        signal: controller.signal,
                        cache: 'no-cache'
                    });
                    
                    clearTimeout(timeout);
                    
                    if (!response.ok) throw new Error('歌词文件加载失败');
                    
                    const lrcContent = await response.text();
                    const parser = new LyricParser();
                    const result = parser.parse(lrcContent);
                    
                    this.lyrics = result.lyrics;
                    this.renderLyrics();
                    this.showStatus('success', `歌词加载成功：${result.title || '音乐'}`);
                    
                    if (result.title) this.title.textContent = result.title;
                    
                    if (this.lyrics.length > 0) {
                        setTimeout(() => {
                            if (this.isCollapsed) this.toggle.click();
                        }, 500);
                    }
                } catch (error) {
                    let message = '歌词加载失败';
                    if (error.name === 'AbortError') message = '歌词加载超时';
                    else if (error.message) message += '：' + error.message;
                    this.showStatus('error', message);
                    this.title.textContent = '暂无歌词';
                }
            }
            
            renderLyrics() {
                this.linesContainer.innerHTML = '';
                this.lyrics.forEach((lyric, index) => {
                    const line = document.createElement('div');
                    line.className = 'lyrics-line';
                    line.textContent = lyric.text || '♪ ~ ♪';
                    line.dataset.index = index;
                    this.linesContainer.appendChild(line);
                });
            }
            
            update(currentTime) {
                if (this.lyrics.length === 0) return;
                
                let newIndex = -1;
                for (let i = this.lyrics.length - 1; i >= 0; i--) {
                    if (currentTime >= this.lyrics[i].time) {
                        newIndex = i;
                        break;
                    }
                }
                
                if (newIndex !== this.currentIndex) {
                    this.currentIndex = newIndex;
                    this.highlightLine(newIndex);
                }
                
                const totalDuration = this.lyrics[this.lyrics.length - 1].time;
                const progress = (currentTime / totalDuration) * 100;
                this.progressBar.style.width = Math.min(progress, 100) + '%';
            }
            
            highlightLine(index) {
                document.querySelectorAll('.lyrics-line').forEach(line => line.classList.remove('active'));
                
                if (index >= 0) {
                    const activeLine = document.querySelector(`[data-index="${index}"]`);
                    if (activeLine) {
                        activeLine.classList.add('active');
                        
                        if (!this.isReducedMotion) {
                            const containerHeight = this.linesContainer.parentElement.clientHeight;
                            const lineHeight = activeLine.offsetHeight;
                            const offset = activeLine.offsetTop - (containerHeight / 2) + (lineHeight / 2);
                            this.linesContainer.style.transform = `translateY(-${offset}px)`;
                        }
                    }
                }
            }
            
            seekToTime(time) {
                const audio = document.getElementById('bgMusic');
                if (audio && !isNaN(time)) {
                    audio.currentTime = time;
                    if (audio.paused) document.getElementById('musicButton').click();
                }
            }
            
            showStatus(type, message) {
                this.status.className = 'lyrics-status ' + type;
                this.status.querySelector('span').textContent = message;
                
                const icon = this.status.querySelector('i');
                switch(type) {
                    case 'loading': icon.className = 'fas fa-spinner'; break;
                    case 'error': icon.className = 'fas fa-exclamation-circle'; break;
                    case 'success': icon.className = 'fas fa-check-circle'; break;
                    default: icon.className = 'fas fa-info-circle';
                }
            }
            
            reset() {
                this.currentIndex = -1;
                this.highlightLine(-1);
                this.progressBar.style.width = '0%';
                this.linesContainer.style.transform = 'translateY(0)';
            }
        }

            const optimizedUpdate = () => {

                    updateBeijingTime();
                    lastTimeUpdate = now;
                }
                if (now - lastUptimeUpdate >= 1000) {
                    updateUptime();
                    lastUptimeUpdate = now;
                }
                requestAnimationFrame(optimizedUpdate);
            };
            requestAnimationFrame(optimizedUpdate);

            }, 5 * 60 * 1000);
