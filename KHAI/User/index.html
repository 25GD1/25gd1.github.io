<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>可豪AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f5f7; height: 100vh; display: flex; flex-direction: column;
  }
  header {
    background: #fff; padding: 16px 20px; border-bottom: 1px solid #e5e5e7;
    display: flex; align-items: center; gap: 10px;
  }
  header h1 { font-size: 18px; font-weight: 600; color: #1d1d1f; }
  header .status { font-size: 12px; color: #86868b; margin-left: auto; }
  header .status.ok { color: #30d158; }
  #chat {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .msg { max-width: 80%; padding: 12px 16px; border-radius: 16px; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: #007aff; color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: #fff; color: #1d1d1f; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
  .msg.bot.loading { color: #86868b; font-style: italic; }
  #input-area {
    background: #fff; border-top: 1px solid #e5e5e7; padding: 12px 20px;
    display: flex; gap: 10px;
  }
  #input { flex: 1; border: 1px solid #d2d2d7; border-radius: 20px; padding: 10px 16px; font-size: 15px; outline: none; resize: none; max-height: 120px; font-family: inherit; }
  #input:focus { border-color: #007aff; }
  #send { background: #007aff; color: #fff; border: none; border-radius: 20px; padding: 0 24px; font-size: 15px; cursor: pointer; font-weight: 500; }
  #send:disabled { background: #d2d2d7; cursor: not-allowed; }
</style>
</head>
<body>
  <header>
    <h1>可豪AI</h1>
    <span class="status" id="status">连接中...</span>
  </header>
  <div id="chat"></div>
  <div id="input-area">
    <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
    <button id="send">发送</button>
  </div>

<script>
const API = "https://seo-keith-keyboards-deutsche.trycloudflare.com";
const MODEL = "kehao-ai-q8:latest";

const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const statusEl = document.getElementById("status");

const history = [];

function addMsg(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;

  addMsg("user", text);
  history.push({ role: "user", content: text });
  inputEl.value = "";
  inputEl.style.height = "auto";
  sendBtn.disabled = true;

  const botEl = addMsg("bot", "思考中...");
  botEl.classList.add("loading");

  try {
    const res = await fetch(API + "/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: MODEL, messages: history, stream: false })
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const reply = data.message.content;
    botEl.textContent = reply;
    botEl.classList.remove("loading");
    history.push({ role: "assistant", content: reply });
  } catch (e) {
    botEl.textContent = "❌ 出错了：" + e.message + "（可能后台服务没开）";
    botEl.classList.remove("loading");
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.onclick = send;
inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
});

// 启动时检测后台是否在线
fetch(API + "/api/tags")
  .then(r => r.json())
  .then(() => { statusEl.textContent = "● 在线"; statusEl.classList.add("ok"); })
  .catch(() => { statusEl.textContent = "● 离线"; });
</script>
</body>
</html>
