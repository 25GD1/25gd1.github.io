<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<title>免罚卡查询 · GLCN</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --p:#2563EB;--pl:#EBF4FF;
  --gold:#c9a962;
  --bg:#F4F7FC;--card:#fff;--border:#E8EEF8;
  --text:#0A1628;--t2:#3B5073;--muted:#8FA3BF;
  --shadow:0 4px 16px rgba(10,22,40,.06),0 1px 3px rgba(10,22,40,.04);
  --shadow-colored:0 8px 24px rgba(37,99,235,.18);
  --r:16px;--r-sm:12px;
  --ease-out-expo:cubic-bezier(0.16,1,0.3,1);
  --ease-spring:cubic-bezier(0.32,0.72,0,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  min-height:100%;
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{cursor:pointer;border:none;background:none;font-family:inherit;font-size:14px;touch-action:manipulation}
input{font-family:inherit;font-size:14px;-webkit-appearance:none;appearance:none}
a{color:inherit;text-decoration:none}

/* ── 头部 ── */
.hdr{
  position:sticky;top:0;z-index:100;height:56px;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}
.hdr-inner{
  max-width:720px;margin:0 auto;height:100%;
  display:flex;align-items:center;gap:10px;padding:0 16px;
}
.hdr-logo{
  width:32px;height:32px;border-radius:10px;
  background:linear-gradient(135deg,var(--p),#7C3AED);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;box-shadow:var(--shadow-colored);
}
.hdr-logo span{font-size:16px;font-weight:800;color:#fff}
.hdr-title{font-size:17px;font-weight:700;letter-spacing:-0.2px}
.hdr-subtitle{font-size:11px;color:var(--muted);line-height:1.3}

/* ── 主站跳转按钮（右上角） ── */
.hdr-home-btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:7px 14px;border-radius:99px;
  background:var(--pl);color:var(--p);
  font-size:12px;font-weight:700;
  border:1px solid rgba(37,99,235,.15);
  flex-shrink:0;
  transition:all .15s;
}
.hdr-home-btn:hover{background:#dbeafe;transform:translateY(-1px)}
.hdr-home-btn:active{transform:scale(0.96);background:#dbeafe}

/* ── 页面容器 ── */
.ex-page-wrap{
  padding:14px 16px 28px;
  display:flex;flex-direction:column;gap:14px;
  max-width:720px;margin:0 auto;width:100%;
}
.card{
  background:var(--card);border-radius:var(--r);
  border:1px solid var(--border);box-shadow:var(--shadow);
  overflow:hidden;
}

/* ── 表单 ── */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:700;color:var(--t2)}
.field input{
  padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--r-sm);
  background:var(--card);color:var(--text);outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.field input:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.ex-gold-border:focus{border-color:var(--gold)!important;box-shadow:0 0 0 3px rgba(201,169,98,.2)!important}
.form-err{font-size:12px;color:#EF4444;font-weight:600}

/* ── 按钮 ── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 18px;border-radius:var(--r-sm);
  font-weight:600;font-size:13px;transition:all .15s;
  white-space:nowrap;position:relative;overflow:hidden;
}
.btn:active{transform:scale(0.97)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none!important}

/* ── 标签 ── */
.tag{
  display:inline-flex;align-items:center;padding:3px 10px;
  border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap;
  transition:all .15s;
}

/* ── 动画 ── */
@keyframes exScaleIn{from{opacity:0;transform:scale(0.92) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(12px) scale(0.96)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
.ex-scale-in{animation:exScaleIn .45s var(--ease-out-expo) both}

/* ── 3D 卡片 ── */
.ex-card-scene{
  perspective:1000px;width:100%;
  display:flex;justify-content:center;align-items:center;
  padding:12px 0;
  user-select:none;-webkit-user-select:none;
  touch-action:pan-y;
}
.ex-card-scene.dragging{touch-action:none}
.ex-card-3d{
  width:min(290px,78vw);
  aspect-ratio:290/180;
  position:relative;
  transform-style:preserve-3d;
  cursor:grab;
  transition:box-shadow .2s ease;
}
.ex-card-3d:active{cursor:grabbing}
.ex-card-face{
  position:absolute;inset:0;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:24px;border:1.5px solid var(--gold);background:#fff;
  padding:16px;display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:0 10px 24px rgba(201,169,98,.24),0 2px 6px rgba(10,22,40,.04);
  overflow:hidden;
}
.ex-card-back{transform:rotateY(180deg);background:linear-gradient(145deg,#fff 0%,#fbf9f4 100%)}
.ex-shimmer{
  position:absolute;top:0;left:-100%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);
  transform:skewX(-25deg);pointer-events:none;
  animation:exShimmerSweep 5s infinite ease-in-out;
}
@keyframes exShimmerSweep{0%,70%{left:-100%}100%{left:200%}}

/* ── Toast ── */
#toast{
  position:fixed;bottom:28px;left:50%;
  transform:translateX(-50%) translateY(12px);
  background:#1E293B;color:#fff;
  padding:10px 20px;border-radius:99px;
  font-size:13px;font-weight:600;z-index:999;
  opacity:0;transition:none;pointer-events:none;
  white-space:nowrap;max-width:calc(100vw - 40px);text-align:center;
  box-shadow:0 4px 16px rgba(0,0,0,.25);
}
#toast.show{opacity:1;animation:toastIn .35s var(--ease-spring)}

@media(max-width:639px){
  .ex-page-wrap{padding:12px 14px 24px}
}
</style>
</head>

<script>
'use strict';

const SUPABASE_URL='https://backend.appmiaoda.com/projects/supabase315128075593494528';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJhdXRoZW50aWNhdGVkIiwiZXhwIjoyMDk0NTU5NTg4LCJpc3MiOiJzdXBhYmFzZSIsInJvbGUiOiJhbm9uIiwic3ViIjoiYW5vbiJ9.e6fwFRd5ouX4DNkNb2n2xNIooLmsd_JyOMqPmeaawf0';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON);

const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);
  t._t=setTimeout(()=>t.classList.remove('show'),2800);
}

function formatExDate(dateStr){
  if(!dateStr)return'';
  const d=new Date(dateStr);
  if(isNaN(d.getTime()))return dateStr;
  return `${d.getMonth()+1}月${d.getDate()}日`;
}

/* ── 输入记忆 ── */
function restoreExemptionInputs(){
  try{
    const saved=localStorage.getItem('glcn_ex_inputs');
    if(saved){
      const d=JSON.parse(saved);
      if(d.seat)document.getElementById('ex-input-seat').value=d.seat;
      if(d.name)document.getElementById('ex-input-name').value=d.name;
    }
  }catch(_){}
}
function saveExemptionInputs(seat,name){
  try{localStorage.setItem('glcn_ex_inputs',JSON.stringify({seat,name}))}catch(_){}
}

/* ── 3D 旋转 ── */
let exRotY=0,exRotX=-4,exDragging=false,exStartX=0,exStartY=0,exAnimId=null;

function update3DCardTransform(){
  const card=document.getElementById('ex-card-3d');
  if(card)card.style.transform=`rotateX(${exRotX}deg) rotateY(${exRotY}deg)`;
}
function start3DCardAutoRotate(){
  if(exAnimId)cancelAnimationFrame(exAnimId);
  (function loop(){
    if(!exDragging){
      exRotY+=0.35;
      exRotX+=(0-exRotX)*0.05;
      update3DCardTransform();
    }
    exAnimId=requestAnimationFrame(loop);
  })();
}
function init3DCardEvents(){
  const scene=document.getElementById('ex-card-scene');
  const card=document.getElementById('ex-card-3d');
  if(!scene||!card)return;

  function down(e){
    exDragging=true;
    scene.classList.add('dragging');
    const x=e.touches?e.touches[0].clientX:e.clientX;
    const y=e.touches?e.touches[0].clientY:e.clientY;
    exStartX=x;exStartY=y;
    if(exAnimId)cancelAnimationFrame(exAnimId);
    card.style.cursor='grabbing';
  }
  function move(e){
    if(!exDragging)return;
    if(e.cancelable)e.preventDefault();
    const x=e.touches?e.touches[0].clientX:e.clientX;
    const y=e.touches?e.touches[0].clientY:e.clientY;
    const dx=x-exStartX,dy=y-exStartY;
    exStartX=x;exStartY=y;
    exRotY+=dx*0.7;
    exRotX=Math.max(-45,Math.min(45,exRotX-dy*0.4));
    update3DCardTransform();
  }
  function up(){
    if(!exDragging)return;
    exDragging=false;
    scene.classList.remove('dragging');
    card.style.cursor='grab';
    start3DCardAutoRotate();
  }

  scene.addEventListener('mousedown',down);
  window.addEventListener('mousemove',move);
  window.addEventListener('mouseup',up);
  scene.addEventListener('touchstart',down,{passive:true});
  scene.addEventListener('touchmove',move,{passive:false});
  window.addEventListener('touchend',up);

  update3DCardTransform();
  start3DCardAutoRotate();
}

/* ── 查询 ── */
async function queryExemptionCard(){
  const seatInput=document.getElementById('ex-input-seat');
  const nameInput=document.getElementById('ex-input-name');
  const errEl=document.getElementById('ex-query-err');
  const btn=document.getElementById('ex-query-btn');
  const resContainer=document.getElementById('ex-result-container');

  const seatVal=parseInt(seatInput?.value?.trim()||'',10);
  const nameVal=nameInput?.value?.trim()||'';

  if(isNaN(seatVal)||seatVal<=0){
    errEl.textContent='请输入有效的正整数座号';
    errEl.style.display='block';
    return;
  }
  if(!nameVal){
    errEl.textContent='请输入学生姓名';
    errEl.style.display='block';
    return;
  }

  errEl.style.display='none';
  btn.disabled=true;
  btn.style.opacity='0.7';
  btn.textContent='查询中...';

  try{
    const{data,error}=await sb.rpc('get_student_digital_exemption',{
      p_seat:seatVal,
      p_name:nameVal
    });

    if(error)throw error;

    if(!data||!data.success){
      errEl.textContent=data?.error||'未找到对应座号和姓名的学生，请核对后重试';
      errEl.style.display='block';
      resContainer.style.display='none';
      return;
    }

    saveExemptionInputs(seatVal,nameVal);
    renderExemptionResult(data);
    resContainer.style.display='flex';

    setTimeout(()=>{
      resContainer.scrollIntoView({behavior:'smooth',block:'start'});
    },300);
  }catch(e){
    errEl.textContent=e.message||'查询失败，请检查网络';
    errEl.style.display='block';
    resContainer.style.display='none';
  }finally{
    btn.disabled=false;
    btn.style.opacity='1';
    btn.innerHTML=`<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> 立即查询`;
  }
}

/* ── 渲染结果 ── */
function renderExemptionResult(data){
  const student=data.student||{};
  const balance=typeof data.balance==='number'?data.balance:0;
  const records=Array.isArray(data.records)?data.records:[];

  document.getElementById('ex-res-seat-badge').textContent=`${student.seat_number}号`;
  document.getElementById('ex-res-student-name').textContent=student.student_name||'';

  const statusSub=document.getElementById('ex-res-status-sub');
  const balTag=document.getElementById('ex-res-balance-tag');
  const cardArea=document.getElementById('ex-3d-card-area');
  const zeroEmpty=document.getElementById('ex-empty-zero');
  const debtAlert=document.getElementById('ex-debt-alert');

  if(balance>0){
    statusSub.textContent=`当前持有：${balance} 张免罚卡`;
    balTag.textContent=`余 ${balance} 张`;
    balTag.style.background='#FAF5E8';
    balTag.style.color='#c9a962';
    balTag.style.borderColor='#c9a962';

    cardArea.style.display='block';
    zeroEmpty.style.display='none';
    debtAlert.style.display='none';
    document.getElementById('ex-card-number').textContent=Math.max(0,balance);

    const lastGain=records.find(r=>r.type==='gain');
    if(lastGain){
      const d=new Date(lastGain.date||lastGain.created_at);
      if(!isNaN(d.getTime())){
        document.getElementById('ex-card-back-date').textContent=
          `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}`;
      }
    }
  }else if(balance===0){
    statusSub.textContent='当前未持有免罚卡';
    balTag.textContent='无卡';
    balTag.style.background='#F1F5F9';
    balTag.style.color='#64748B';
    balTag.style.borderColor='#CBD5E1';

    cardArea.style.display='none';
    zeroEmpty.style.display='flex';
    debtAlert.style.display='none';
  }else{
    const debtWeeks=Math.abs(balance);
    statusSub.textContent=`待处理违规：${debtWeeks} 周`;
    balTag.textContent=`待处理 ${debtWeeks} 周`;
    balTag.style.background='#FEF2F2';
    balTag.style.color='#EF4444';
    balTag.style.borderColor='rgba(239,68,68,.3)';

    cardArea.style.display='none';
    zeroEmpty.style.display='none';
    debtAlert.style.display='flex';
    document.getElementById('ex-debt-title').textContent=`有 ${debtWeeks} 周待处理`;
  }

  renderExemptionRecords(records);
}

function renderExemptionRecords(records){
  const countEl=document.getElementById('ex-records-count');
  const listEl=document.getElementById('ex-records-list');
  countEl.textContent=`共 ${records.length} 条`;

  if(!records||records.length===0){
    listEl.innerHTML=`
      <div style="padding:24px;text-align:center;color:var(--muted);font-size:12px">
        暂无任何免罚卡或违规流水记录
      </div>`;
    return;
  }

  listEl.innerHTML=records.map(r=>{
    const isGain=r.type==='gain';
    const isUse=r.type==='use';

    let iconBg='#FAF5E8',iconColor='#c9a962',deltaText='',deltaColor='#c9a962',svgIcon='';

    if(isGain){
      deltaText=`+${Math.abs(r.amount||1)} 张`;
      svgIcon=`<svg width="16" height="16" fill="none" stroke="${iconColor}" stroke-width="2.2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`;
    }else if(isUse){
      iconBg='#ECFDF5';iconColor='#059669';
      deltaText=`-${Math.abs(r.amount||1)} 张`;
      deltaColor='#059669';
      svgIcon=`<svg width="16" height="16" fill="none" stroke="${iconColor}" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`;
    }else{
      iconBg='#FEF2F2';iconColor='#EF4444';
      deltaText=`违规待收 ${Math.abs(r.amount||1)} 周`;
      deltaColor='#EF4444';
      svgIcon=`<svg width="16" height="16" fill="none" stroke="${iconColor}" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`;
    }

    return `
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;background:#FAFBFD;border:1px solid var(--border)">
        <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">
          <div style="width:32px;height:32px;border-radius:10px;background:${iconBg};display:flex;align-items:center;justify-content:center;flex-shrink:0">
            ${svgIcon}
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
              ${esc(r.note||(isGain?'获得免罚卡奖励':isUse?'抵消违纪使用':'手机管理违纪处罚'))}
            </div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px">
              ${esc(formatExDate(r.date||r.created_at))}
            </div>
          </div>
        </div>
        <div style="font-size:13px;font-weight:800;color:${deltaColor};margin-left:8px;flex-shrink:0">
          ${deltaText}
        </div>
      </div>`;
  }).join('');
}

/* ── 初始化 ── */
(function init(){
  restoreExemptionInputs();
  init3DCardEvents();
})();
</script>
</body>
</html>
