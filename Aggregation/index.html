<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>每课一练 · 参考答案</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: #05071c;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
       -moz-user-select: none;
        -ms-user-select: none;
            user-select: none;
    -webkit-touch-callout: none;
    -webkit-user-drag: none;
  }
  * , *::before, *::after {
    -webkit-user-select: none;
       -moz-user-select: none;
        -ms-user-select: none;
            user-select: none;
    -webkit-touch-callout: none;
  }

  .bg {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, #1e1b4b 0%, transparent 55%),
      radial-gradient(ellipse at 80% 80%, #3b0764 0%, transparent 55%),
      radial-gradient(ellipse at 50% 50%, #0b1030 0%, #05071c 100%);
    z-index: 0;
  }
  .aurora {
    position: fixed; inset: -10%;
    background:
      radial-gradient(circle at 30% 30%, rgba(99,102,241,0.35), transparent 45%),
      radial-gradient(circle at 70% 60%, rgba(168,85,247,0.28), transparent 45%),
      radial-gradient(circle at 40% 80%, rgba(59,130,246,0.22), transparent 50%);
    filter: blur(60px);
    animation: auroraMove 28s ease-in-out infinite alternate;
    z-index: 1;
    transform: translateZ(0);
    will-change: transform;
    backface-visibility: hidden;
  }
  @keyframes auroraMove {
    0%   { transform: translate3d(0,0,0) rotate(0deg) scale(1); }
    50%  { transform: translate3d(3%, -2%, 0) rotate(8deg) scale(1.06); }
    100% { transform: translate3d(-2%, 3%, 0) rotate(-6deg) scale(1.03); }
  }

  #particles {
    position: fixed; inset: 0;
    z-index: 2;
    pointer-events: none;
  }

  .scene {
    --glow: 0;
    position: relative;
    z-index: 10;
    perspective: 1400px;
    perspective-origin: 50% 50%;
  }

  /* ═══ 按压光晕：白蓝柔光 ═══ */
  .press-glow {
    position: absolute;
    inset: -86px;
    border-radius: 140px;
    background: radial-gradient(
      ellipse 55% 55% at center,
      rgba(255, 255, 255, 0.26) 0%,
      rgba(248, 251, 255, 0.24) 10%,
      rgba(232, 240, 255, 0.19) 22%,
      rgba(210, 224, 250, 0.13) 36%,
      rgba(185, 205, 240, 0.08) 52%,
      rgba(160, 185, 225, 0.035) 70%,
      transparent 88%
    );
    opacity: calc(var(--glow) * 0.85);
    transform: scale(calc(0.94 + var(--glow) * 0.16));
    pointer-events: none;
    z-index: 0;
    will-change: opacity, transform;
    backface-visibility: hidden;
  }

  .card {
    position: relative;
    z-index: 2;
    width: min(90vw, 420px);
    padding: 46px 32px 40px;
    border-radius: 26px;
    text-align: center;

    background:
      linear-gradient(135deg,
        rgba(255,255,255,0.10) 0%,
        rgba(255,255,255,0.04) 50%,
        rgba(255,255,255,0.08) 100%);
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow:
      0 30px 70px rgba(10, 5, 40, 0.65),
      0 0 0 1px rgba(255,255,255,0.05) inset,
      0 1px 0 rgba(255,255,255,0.2) inset;
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);

    transform-style: preserve-3d;
    transform:
      rotateX(var(--rx, 0deg))
      rotateY(var(--ry, 0deg))
      translate3d(0, var(--py, 0px), 0)
      scale(var(--sc, 1));
    transition: box-shadow 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform;
    backface-visibility: hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: -1.5px;
    border-radius: 27px;
    padding: 1.5px;
    background: conic-gradient(
      from var(--angle, 0deg),
      transparent 0deg,
      #6366f1 90deg,
      #a855f7 180deg,
      #3b82f6 270deg,
      transparent 360deg
    );
    -webkit-mask:
      linear-gradient(#fff 0 0) content-box,
      linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    animation: angleRotate 6s linear infinite;
    pointer-events: none;
    transition: filter 0.30s ease;
  }
  @property --angle {
    syntax: "<angle>";
    initial-value: 0deg;
    inherits: false;
  }
  @keyframes angleRotate { to { --angle: 360deg; } }

  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 26px;
    background: radial-gradient(
      260px circle at var(--mx, 50%) var(--my, 50%),
      rgba(139, 92, 246, 0.22),
      rgba(99, 102, 241, 0.07) 40%,
      transparent 65%
    );
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .card:hover::after { opacity: 1; }

  .card.pressed {
    box-shadow:
      0 8px 26px rgba(10, 5, 40, 0.70),
      0 0 0 1px rgba(255, 255, 255, 0.08) inset,
      0 0 56px rgba(215, 228, 255, 0.26),
      0 0 116px rgba(185, 205, 245, 0.11);
    transition-duration: 0.20s;
  }
  .card.pressed::before {
    filter: brightness(1.30);
  }

  /* ═══════════════════════════════════════════════════════
     标题 —— 丝滑入场（v2）
     关键优化：
       ① 动画只驱动 transform / opacity / filter:blur
          —— 去掉了 drop-shadow（最耗性能的部分）
       ② 拆成两个独立动画：
          charMove → transform（1.55s，长尾缓动）
          charFade → opacity + filter（1.1s，快收敛）
          模糊先行收敛，位移慢慢到位
       ③ 缓动曲线改为 cubic-bezier(0.16, 1, 0.3, 1)
          —— 前段有启动感，后段极慢收尾，非常"滑"
  ═══════════════════════════════════════════════════════ */
  .title {
    position: relative;
    display: flex;
    justify-content: center;
    gap: 4px;
    margin-bottom: 12px;
    transform: translateZ(30px);
  }

  /* 标题背后的静态辉光（替代 drop-shadow） */
  .title::before {
    content: "";
    position: absolute;
    left: 50%; top: 50%;
    width: 165%;
    height: 260%;
    transform: translate(-50%, -50%) scale(0.8);
    background: radial-gradient(
      ellipse at center,
      rgba(199, 210, 254, 0.42) 0%,
      rgba(139, 92, 246, 0.22) 32%,
      rgba(99, 102, 241, 0.10) 55%,
      transparent 76%
    );
    filter: blur(18px);
    z-index: -1;
    pointer-events: none;
    opacity: 0;
    animation: glowIn 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.85s forwards;
  }
  @keyframes glowIn {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }

  .title span {
    display: inline-block;
    font-size: 1.72rem;
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: 2px;
    padding-bottom: 2px;

    background-image: linear-gradient(
      115deg,
      #ffffff 0%,
      #e6ebff 20%,
      #f4ecff 42%,
      #e2edff 64%,
      #ffffff 84%,
      #ffffff 100%
    );
    background-size: 220% 100%;
    background-position: 0% 50%;
    -webkit-background-clip: text;
            background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;

    /* 静态初始状态（delay 期间保持） */
    opacity: 0;
    transform: translate3d(var(--tx, 0), var(--ty, 0), 0) scale(0.72);
    filter: blur(8px);

    /* 只提示 transform / opacity / filter，让浏览器预先合成 */
    will-change: transform, opacity, filter;

    animation:
      charMove 1.55s cubic-bezier(0.16, 1, 0.3, 1) forwards,
      charFade 1.10s cubic-bezier(0.22, 1, 0.36, 1) forwards,
      titleShine 7.5s ease-in-out infinite;
  }

  .title span:nth-child(1) { animation-delay: 0.05s, 0.05s, 1.85s; --tx: -38px; --ty: -28px; }
  .title span:nth-child(2) { animation-delay: 0.18s, 0.18s, 1.98s; --tx:  22px; --ty: -46px; }
  .title span:nth-child(3) { animation-delay: 0.31s, 0.31s, 2.11s; --tx: -26px; --ty: -40px; }
  .title span:nth-child(4) { animation-delay: 0.44s, 0.44s, 2.24s; --tx:  34px; --ty: -32px; }

  /* 位移：长尾缓动，85% 已就位，最后 15% 微调落定 */
  @keyframes charMove {
    0% {
      transform: translate3d(var(--tx), var(--ty), 0) scale(0.72);
    }
    85% {
      transform: translate3d(0, 0, 0) scale(0.985);
    }
    100% {
      transform: translate3d(0, 0, 0) scale(1);
    }
  }

  /* 透明度 + 模糊：快速收敛，剩下的时间留给位移慢慢滑入 */
  @keyframes charFade {
    0%   { opacity: 0; filter: blur(8px); }
    55%  { opacity: 1; filter: blur(1.2px); }
    100% { opacity: 1; filter: blur(0); }
  }

  @keyframes titleShine {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  .subtitle {
    font-size: 0.78rem;
    letter-spacing: 4px;
    color: rgba(214, 222, 255, 0.78);
    margin-bottom: 6px;
    transform: translateZ(20px);
    opacity: 0;
    animation: subIn 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.85s forwards;
  }
  @keyframes subIn {
    from { opacity: 0; letter-spacing: 12px; filter: blur(5px); }
    to   { opacity: 1; letter-spacing: 4px;  filter: blur(0); }
  }

  .divider {
    width: 70px;
    height: 2px;
    margin: 22px auto 30px;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, #818cf8, #a855f7, #818cf8, transparent);
    background-size: 200% 100%;
    transform: translateZ(15px) scaleX(0);
    animation:
      divIn 1.05s cubic-bezier(0.16, 1, 0.3, 1) 1.00s forwards,
      divShine 3s linear infinite 2.05s;
  }
  @keyframes divIn { to { transform: translateZ(15px) scaleX(1); } }
  @keyframes divShine {
    from { background-position: 200% 0; }
    to   { background-position: 0% 0; }
  }

  .btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 18px 22px;
    margin-bottom: 16px;
    border: none;
    border-radius: 16px;
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 2px;
    color: #fff;
    text-decoration: none;
    cursor: pointer;
    overflow: hidden;
    isolation: isolate;
    transform: translateZ(35px) translateY(22px);
    opacity: 0;
    will-change: transform, opacity, box-shadow;
    -webkit-tap-highlight-color: transparent;
    transition:
      transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
      box-shadow 0.5s cubic-bezier(0.22, 1, 0.36, 1),
      filter 0.4s ease;
  }

  .btn-1 {
    background: linear-gradient(135deg, #4f46e5 0%, #6366f1 50%, #818cf8 100%);
    box-shadow: 0 12px 28px rgba(79, 70, 229, 0.5);
    animation: btnIn 1.1s cubic-bezier(0.16, 1, 0.3, 1) 1.20s forwards;
  }
  .btn-2 {
    background: linear-gradient(135deg, #7c3aed 0%, #a855f7 50%, #c084fc 100%);
    box-shadow: 0 12px 28px rgba(124, 58, 237, 0.5);
    animation: btnIn 1.1s cubic-bezier(0.16, 1, 0.3, 1) 1.45s forwards;
  }
  @keyframes btnIn {
    to { opacity: 1; transform: translateZ(35px) translateY(0); }
  }

  .btn::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: inherit;
    filter: blur(18px);
    opacity: 0;
    z-index: -1;
    transition: opacity 0.5s ease;
  }

  .btn::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(
      100deg,
      transparent 30%,
      rgba(255,255,255,0.45) 50%,
      transparent 70%
    );
    transform: translate3d(-120%, 0, 0);
    transition: transform 0.95s cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: none;
  }

  @media (hover: hover) {
    .btn:hover {
      transform: translateZ(50px) translateY(-4px) scale(1.02);
      filter: brightness(1.1);
    }
    .btn-1:hover { box-shadow: 0 22px 44px rgba(99, 102, 241, 0.7); }
    .btn-2:hover { box-shadow: 0 22px 44px rgba(168, 85, 247, 0.7); }
    .btn:hover::before { opacity: 0.8; }
    .btn:hover::after  { transform: translate3d(120%, 0, 0); }
    .btn:hover .icon   { transform: rotate(-12deg) scale(1.15); }
    .btn:hover .arrow  { transform: translate3d(6px, 0, 0); opacity: 1; }
  }

  .btn:active {
    transform: translateZ(35px) translateY(-1px) scale(0.975);
    transition-duration: 0.12s;
  }

  .btn .icon {
    display: inline-block;
    font-size: 1.2rem;
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .btn .arrow {
    display: inline-block;
    font-size: 0.95rem;
    opacity: 0.7;
    transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.3s ease;
  }

  .hint {
    margin: 2px 0 16px;
    font-size: 0.72rem;
    letter-spacing: 0.5px;
    color: rgba(206, 214, 255, 0.72);
    line-height: 1.6;
    transform: translateZ(10px);
    opacity: 0;
    animation: fadeUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) 1.60s forwards;
  }
  .hint .spin {
    display: inline-block;
    margin-right: 4px;
    animation: slowSpin 7s linear infinite;
  }
  @keyframes slowSpin {
    from { transform: rotate(0); }
    to   { transform: rotate(360deg); }
  }

  .footer {
    margin-top: 26px;
    font-size: 0.7rem;
    letter-spacing: 1.5px;
    color: rgba(165, 180, 252, 0.5);
    transform: translateZ(8px);
    opacity: 0;
    animation: fadeUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) 1.85s forwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .burst {
    position: fixed;
    pointer-events: none;
    z-index: 100;
    border-radius: 50%;
    will-change: transform, opacity;
    backface-visibility: hidden;
  }

  @media (max-width: 380px) {
    .card { padding: 36px 22px 30px; }
    .title span { font-size: 1.4rem; }
    .btn { font-size: 0.95rem; padding: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .card { transform: none !important; }
    .title span {
      opacity: 1 !important;
      filter: none !important;
      transform: none !important;
    }
    .title::before { opacity: 1 !important; }
  }
</style>
</head>
<body>

  <div class="bg"></div>
  <div class="aurora"></div>
  <canvas id="particles"></canvas>

  <div class="scene" id="scene">
    <div class="press-glow" aria-hidden="true"></div>

    <main class="card" id="card">
      <h1 class="title">
        <span>每</span><span>课</span><span>一</span><span>练</span>
      </h1>
      <p class="subtitle">参考答案</p>
      <div class="divider"></div>

      <a class="btn btn-1" href="https://25gd1.github.io/CN/" target="_blank" rel="noopener noreferrer">
        <span class="icon">♪♯</span>
        <span>语文每课一练</span>
        <span class="arrow">→</span>
      </a>

      <p class="hint">
        <span class="spin">♺</span>语文文件较大，加载需耐心
      </p>

      <a class="btn btn-2" href="https://25gd1.github.io/CK/" target="_blank" rel="noopener noreferrer">
        <span class="icon">♭♮</span>
        <span>政治每课一练</span>
        <span class="arrow">→</span>
      </a>

      <p class="footer">新标签页打开</p>
    </main>
  </div>

<script>
(function () {
  'use strict';

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ═══ 禁止复制 ═══ */
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); }, { passive: false });
  ['copy', 'cut', 'dragstart'].forEach(function (evt) {
    document.addEventListener(evt, function (e) { e.preventDefault(); });
  });
  document.addEventListener('keydown', function (e) {
    const mod = e.ctrlKey || e.metaKey;
    if (!mod) return;
    const k = (e.key || '').toLowerCase();
    if (k === 'c' || k === 'x' || k === 'a' || k === 'u' || k === 's') e.preventDefault();
  });

  /* ═══ 粒子星空 ═══ */
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, particles = [];

  const COUNT = reduceMotion ? 0 : (window.innerWidth < 640 ? 42 : 88);
  const LINK_DIST = 135, LINK_DIST2 = LINK_DIST * LINK_DIST;
  const MOUSE_R = 160, MOUSE_R2 = MOUSE_R * MOUSE_R;
  const mouse = { x: -9999, y: -9999, active: false };

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function seed() {
    particles = [];
    for (let i = 0; i < COUNT; i++) {
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.32,
        vy: (Math.random() - 0.5) * 0.32,
        r: Math.random() * 1.5 + 0.7,
        hue: Math.random() < 0.5
          ? 236 + Math.random() * 28
          : 276 + Math.random() * 36
      });
    }
  }

  let prevT = performance.now();
  let running = false;

  function loop(now) {
    const dt = Math.min((now - prevT) / 16.6667, 2.5) || 1;
    prevT = now;
    ctx.clearRect(0, 0, W, H);

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      if (mouse.active) {
        const dx = p.x - mouse.x;
        const dy = p.y - mouse.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < MOUSE_R2 && d2 > 0.5) {
          const d = Math.sqrt(d2);
          const falloff = 1 - d / MOUSE_R;
          const f = falloff * falloff * 0.75 * dt;
          p.vx += (dx / d) * f;
          p.vy += (dy / d) * f;
        }
      }
      const damp = Math.pow(0.965, dt);
      p.vx *= damp;
      p.vy *= damp;
      const sp = Math.hypot(p.vx, p.vy);
      if (sp < 0.06) {
        p.vx += (Math.random() - 0.5) * 0.06 * dt;
        p.vy += (Math.random() - 0.5) * 0.06 * dt;
      } else if (sp > 1.8) {
        p.vx = (p.vx / sp) * 1.8;
        p.vy = (p.vy / sp) * 1.8;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.x < -24) p.x = W + 24; else if (p.x > W + 24) p.x = -24;
      if (p.y < -24) p.y = H + 24; else if (p.y > H + 24) p.y = -24;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, 6.2832);
      ctx.fillStyle = 'hsla(' + p.hue + ',92%,78%,.9)';
      ctx.shadowBlur = 7;
      ctx.shadowColor = 'hsla(' + p.hue + ',92%,68%,.9)';
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    ctx.lineWidth = 0.65;
    for (let i = 0; i < particles.length; i++) {
      const a = particles[i];
      for (let j = i + 1; j < particles.length; j++) {
        const b = particles[j];
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < LINK_DIST2) {
          const alpha = (1 - Math.sqrt(d2) / LINK_DIST) * 0.34;
          ctx.strokeStyle = 'rgba(165,180,252,' + alpha.toFixed(3) + ')';
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }
    if (running) requestAnimationFrame(loop);
  }

  function startParticles() {
    if (running || COUNT === 0) return;
    running = true;
    prevT = performance.now();
    requestAnimationFrame(loop);
  }
  function stopParticles() { running = false; }

  if (COUNT > 0) {
    resize();
    seed();
    startParticles();
    let rt;
    window.addEventListener('resize', function () {
      clearTimeout(rt);
      rt = setTimeout(function () { resize(); seed(); }, 150);
    });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) stopParticles();
      else startParticles();
    });
  }

  /* ═══ 卡片按压系统 ═══ */
  const scene = document.getElementById('scene');
  const card  = document.getElementById('card');

  const MAX_TILT   = 8;
  const PRESS_SCALE_DROP = 0.105;
  const PRESS_Y = 7;

  const STATE = {
    rx: 0, ry: 0,
    mx: 50, my: 50,
    nx: 0, ny: 0,
    tmx: 50, tmy: 50,
    amt: 0,
    glow: 0
  };
  let tAmt = 0;
  let pressed = false;
  let activePointerId = null;

  let cacheRx = null, cacheRy = null, cacheMx = null, cacheMy = null;
  let cacheSc = null, cachePy = null, cacheGlow = null;
  let loopRunning = false;

  function applyStyles() {
    const rx = STATE.rx.toFixed(2), ry = STATE.ry.toFixed(2);
    if (rx !== cacheRx || ry !== cacheRy) {
      card.style.setProperty('--rx', rx + 'deg');
      card.style.setProperty('--ry', ry + 'deg');
      cacheRx = rx; cacheRy = ry;
    }
    const mx = STATE.mx.toFixed(2), my = STATE.my.toFixed(2);
    if (mx !== cacheMx || my !== cacheMy) {
      card.style.setProperty('--mx', mx + '%');
      card.style.setProperty('--my', my + '%');
      cacheMx = mx; cacheMy = my;
    }
    const amt = STATE.amt;
    const sc = (1 - PRESS_SCALE_DROP * amt).toFixed(4);
    const py = (PRESS_Y * amt).toFixed(2) + 'px';
    if (sc !== cacheSc || py !== cachePy) {
      card.style.setProperty('--sc', sc);
      card.style.setProperty('--py', py);
      cacheSc = sc; cachePy = py;
    }
    const glowStr = STATE.glow.toFixed(4);
    if (glowStr !== cacheGlow) {
      scene.style.setProperty('--glow', glowStr);
      cacheGlow = glowStr;
    }
  }

  function tick() {
    const kA = tAmt > STATE.amt ? 0.40 : 0.050;
    STATE.amt += (tAmt - STATE.amt) * kA;

    const kG = STATE.amt > STATE.glow ? 0.20 : 0.055;
    STATE.glow += (STATE.amt - STATE.glow) * kG;

    const boost = 1 + STATE.amt * 0.85;
    const targetRx = -STATE.ny * MAX_TILT * boost;
    const targetRy =  STATE.nx * MAX_TILT * boost;
    const kR = pressed ? 0.32 : 0.075;
    STATE.rx += (targetRx - STATE.rx) * kR;
    STATE.ry += (targetRy - STATE.ry) * kR;

    const kM = pressed ? 0.34 : 0.10;
    STATE.mx += (STATE.tmx - STATE.mx) * kM;
    STATE.my += (STATE.tmy - STATE.my) * kM;

    applyStyles();

    const done =
      Math.abs(targetRx - STATE.rx) < 0.01 &&
      Math.abs(targetRy - STATE.ry) < 0.01 &&
      Math.abs(STATE.tmx - STATE.mx) < 0.05 &&
      Math.abs(STATE.tmy - STATE.my) < 0.05 &&
      Math.abs(tAmt - STATE.amt) < 0.0006 &&
      Math.abs(STATE.amt - STATE.glow) < 0.0006;

    if (done) {
      STATE.rx = targetRx; STATE.ry = targetRy;
      STATE.mx = STATE.tmx; STATE.my = STATE.tmy;
      STATE.amt = tAmt;
      STATE.glow = tAmt;
      applyStyles();
      loopRunning = false;
      return;
    }
    requestAnimationFrame(tick);
  }

  function startLoop() {
    if (loopRunning || reduceMotion) return;
    loopRunning = true;
    requestAnimationFrame(tick);
  }

  function aimAt(clientX, clientY) {
    const r = scene.getBoundingClientRect();
    const halfW = r.width / 2, halfH = r.height / 2;

    let nx = (clientX - (r.left + halfW)) / halfW;
    let ny = (clientY - (r.top + halfH)) / halfH;
    nx = Math.max(-1.2, Math.min(1.2, nx));
    ny = Math.max(-1.2, Math.min(1.2, ny));

    STATE.nx = nx;
    STATE.ny = ny;
    STATE.tmx = ((clientX - r.left) / r.width) * 100;
    STATE.tmy = ((clientY - r.top) / r.height) * 100;
  }

  function resetAim() {
    STATE.nx = 0; STATE.ny = 0;
    STATE.tmx = 50; STATE.tmy = 50;
  }

  function clearMouse() {
    mouse.active = false;
    mouse.x = -9999;
    mouse.y = -9999;
  }

  window.addEventListener('pointermove', function (e) {
    const isMouse = e.pointerType === 'mouse' || e.pointerType === '';

    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;

    if (!isMouse && !pressed) return;
    if (activePointerId !== null && e.pointerId !== activePointerId && !isMouse) return;

    aimAt(e.clientX, e.clientY);
    if (pressed) tAmt = 1;
    startLoop();
  }, { passive: true });

  window.addEventListener('pointerdown', function (e) {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;

    const t = e.target;
    if (!t || !t.closest || !t.closest('#card')) return;

    pressed = true;
    activePointerId = e.pointerId;

    try { card.setPointerCapture(e.pointerId); } catch (err) {}

    aimAt(e.clientX, e.clientY);

    if (STATE.amt > 0.30) {
      STATE.amt = Math.max(0.10, STATE.amt - 0.40);
    }
    tAmt = 1;

    card.classList.add('pressed');
    startLoop();
  }, { passive: true });

  function endPress(e) {
    if (!pressed) return;
    if (e && activePointerId !== null && e.pointerId !== activePointerId) return;

    pressed = false;
    activePointerId = null;
    tAmt = 0;
    card.classList.remove('pressed');

    try { card.releasePointerCapture(e.pointerId); } catch (err) {}

    const type = e && e.pointerType;
    if (type === 'touch' || type === 'pen') {
      resetAim();
      clearMouse();
    }
    startLoop();
  }

  window.addEventListener('pointerup', endPress, { passive: true });
  window.addEventListener('pointercancel', endPress, { passive: true });

  window.addEventListener('pointerup', function (e) {
    const type = e.pointerType;
    if ((type === 'touch' || type === 'pen') && !pressed) {
      clearMouse();
    }
  }, { passive: true });

  window.addEventListener('pointercancel', function (e) {
    const type = e.pointerType;
    if (type === 'touch' || type === 'pen') {
      clearMouse();
    }
  }, { passive: true });

  document.addEventListener('mouseleave', function () {
    if (!pressed) clearMouse();
    if (!pressed) { resetAim(); startLoop(); }
  });

  window.addEventListener('blur', function () {
    pressed = false;
    activePointerId = null;
    card.classList.remove('pressed');
    tAmt = 0;
    clearMouse();
    resetAim();
    startLoop();
  });

  /* ═══ 烟花粒子 ═══ */
  const PALETTE = ['#818cf8', '#a855f7', '#60a5fa', '#c084fc', '#93c5fd', '#f0abfc'];

  function burstAt(x, y, count) {
    if (reduceMotion || !document.body.animate) return;
    const n = count || 24;
    for (let i = 0; i < n; i++) {
      const el = document.createElement('div');
      el.className = 'burst';
      const angle = (Math.PI * 2 * i) / n + (Math.random() - 0.5) * 0.55;
      const dist  = 90 + Math.random() * 130;
      const size  = Math.random() < 0.25
        ? 7 + Math.random() * 5
        : 3 + Math.random() * 4;
      const color = PALETTE[(Math.random() * PALETTE.length) | 0];
      const dur   = 1600 + Math.random() * 1000;
      const spin  = ((Math.random() * 360) | 0) - 180;
      const gy    = 12 + Math.random() * 26;
      const tx = Math.cos(angle) * dist;
      const ty = Math.sin(angle) * dist;

      el.style.left = (x - size / 2) + 'px';
      el.style.top  = (y - size / 2) + 'px';
      el.style.width  = size + 'px';
      el.style.height = size + 'px';
      el.style.background = color;
      el.style.boxShadow = '0 0 ' + (size * 2.4).toFixed(1) + 'px ' + color;
      document.body.appendChild(el);

      const anim = el.animate([
        { transform: 'translate3d(0, 0, 0) scale(1) rotate(0deg)', opacity: 1, offset: 0 },
        {
          transform:
            'translate3d(' + (tx * 0.72).toFixed(1) + 'px,' +
                              (ty * 0.72).toFixed(1) + 'px,0) ' +
            'scale(0.95) rotate(' + (spin * 0.4).toFixed(0) + 'deg)',
          opacity: 1, offset: 0.18
        },
        {
          transform:
            'translate3d(' + (tx * 0.92).toFixed(1) + 'px,' +
                              (ty * 0.92 + gy * 0.4).toFixed(1) + 'px,0) ' +
            'scale(0.7) rotate(' + (spin * 0.75).toFixed(0) + 'deg)',
          opacity: 0.85, offset: 0.55
        },
        {
          transform:
            'translate3d(' + tx.toFixed(1) + 'px,' +
                              (ty + gy).toFixed(1) + 'px,0) ' +
            'scale(0.12) rotate(' + spin + 'deg)',
          opacity: 0, offset: 1
        }
      ], {
        duration: dur,
        easing: 'cubic-bezier(0.22, 0.9, 0.30, 1)',
        fill: 'forwards'
      });

      anim.onfinish = function () { el.remove(); };
      setTimeout(function () { el.remove(); }, dur + 350);
    }
  }

  document.querySelectorAll('.btn').forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      let x = e.clientX, y = e.clientY;
      if (!x && e.changedTouches && e.changedTouches[0]) {
        x = e.changedTouches[0].clientX;
        y = e.changedTouches[0].clientY;
      }
      if (!x && !y) {
        const r = btn.getBoundingClientRect();
        x = r.left + r.width / 2;
        y = r.top + r.height / 2;
      }
      burstAt(x, y);
      if (navigator.vibrate) navigator.vibrate(10);
    });
  });

  /* ═══ 彩蛋 ═══ */
  let lastTap = 0;
  card.addEventListener('click', function (e) {
    if (e.target.closest('.btn')) return;
    const now = Date.now();
    if (now - lastTap < 340) {
      const r = card.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;
      burstAt(cx, cy, 30);
      setTimeout(function () { burstAt(cx, cy, 22); }, 220);
      setTimeout(function () { burstAt(cx, cy, 18); }, 440);
    }
    lastTap = now;
  });

})();
</script>

</body>
</html>
